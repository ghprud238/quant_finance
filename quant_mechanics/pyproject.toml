[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-mechanics"
version = "1.0.0"
description = "Frontier Quantitative Mechanics: Prediction Markets Arbitrage & Multivariate Hawkes Processes"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.9.0",
    "pandas>=1.5.0",
    "matplotlib>=3.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
