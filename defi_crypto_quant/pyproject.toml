[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "defi-crypto-quant"
version = "1.0.0"
description = "DeFi, AMM Liquidity & Crypto Quantitative Finance (41-45): Uniswap v2/v3 Concentrated Liquidity, Loss-Versus-Rebalancing (LVR), Cross-DEX MEV Searcher, Perpetual Funding Basis Trading, and On-Chain MVRV / Whale Alpha."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Quant Engineer", email = "quant@example.com" }
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]
