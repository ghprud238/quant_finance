[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "macro-ai-cross-markets"
version = "1.0.0"
description = "Global Macro AI, Crypto & Cross-Economy Sentiment (46-50): Multilingual Central Bank Hawk/Dove NLP, Sovereign Risk Contagion & Volatility Spillovers, Crypto Fear & Greed Sentiment Engine, Cross-Economy FX Carry Trade & Vol Surface, and Autonomous Multi-Agent Macro/Crypto Hedge Fund Swarm."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Quant Engineer", email = "quant@example.com" }
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]
