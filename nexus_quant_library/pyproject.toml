[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-quant"
version = "1.0.0"
description = "Institutional-Grade Cross-Asset Quantitative Finance, DeFi, High-Frequency Microstructure, AI & Climate Risk Library"
readme = "README.md"
authors = [
    { name = "Nexus Quant Core Engineering Group", email = "quant-core@nexusquant.io" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.23.0",
    "pandas>=1.5.0",
    "scipy>=1.9.0",
    "matplotlib>=3.6.0",
    "seaborn>=0.12.0",
]

[project.optional-dependencies]
all = [
    "scikit-learn>=1.2.0",
    "statsmodels>=0.13.0",
    "torch>=2.0.0",
    "tabulate>=0.9.0",
    "pydantic>=2.0.0",
]
hft = [
    "numba>=0.56.0",
]
defi = [
    "web3>=6.0.0",
]
dev = [
    "pytest>=7.2.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.0.260",
    "mypy>=1.0.0",
    "mkdocs>=1.4.0",
    "mkdocs-material>=9.0.0",
]

[project.urls]
Homepage = "https://github.com/nexus-quant/nexus-quant"
Documentation = "https://docs.nexusquant.io"
Repository = "https://github.com/nexus-quant/nexus-quant.git"
"Bug Tracker" = "https://github.com/nexus-quant/nexus-quant/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nexus_quant = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
